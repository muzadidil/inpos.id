<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f7f8fa">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" sizes="192x192" href="assets/icon-192.png">
<title>INPOS • Super Admin</title>
<link rel="stylesheet" href="assets/superadmin.css?v=b1a42ed799">
</head>
<body>
<section class="sa-login" id="saLogin" aria-label="Login Super Admin">
  <div class="sa-auth-card">
    <div class="sa-auth-mark" aria-hidden="true">in</div>
    <h1 id="saAuthHeading">Super Admin INPOS</h1>
    <p class="sa-auth-sub">Masuk untuk mengelola mitra dan langganan.</p>
    <form id="saLoginForm" autocomplete="on" onsubmit="return false">
      <div class="field"><label for="saUsername">Username</label><input id="saUsername" type="text" placeholder="Username Super Admin" autocapitalize="none" spellcheck="false" autocomplete="username" required maxlength="80"></div>
      <div class="field"><label for="saPin">PIN Login</label><div class="sa-auth-pin"><input id="saPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN 6 digit" pattern="[0-9]{6}" maxlength="6" required><button type="button" id="saTogglePin" aria-label="Tampilkan PIN">Lihat</button></div></div>
      <button class="sa-auth-btn" type="submit">Masuk Super Admin</button>
    </form>
    <form id="saPinForm" autocomplete="off" onsubmit="return false" hidden>
      <p class="sa-auth-sub">Demi keamanan, ganti PIN awal sebelum memakai panel.</p>
      <div class="field"><label for="saCurrentPin">PIN awal</label><input id="saCurrentPin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="current-password"></div>
      <div class="field"><label for="saNewPin">PIN baru (6 digit)</label><input id="saNewPin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="new-password"></div>
      <button class="sa-auth-btn" type="submit">Simpan PIN Baru</button>
      <button class="sa-auth-link" type="button" id="saPinCancel">Batal dan keluar</button>
    </form>
    <p class="sa-auth-error" id="saLoginError" role="alert" aria-live="polite"></p>
    <p class="sa-auth-note">Khusus pengelola INPOS. Data tersimpan di server INPOS.</p>
  </div>
</section>
<div class="app">
<header class="top">
  <div class="brand-icon" aria-hidden="true">in</div>
  <div class="brand-heading"><h1>INPOS <span style="font-weight:500;color:#75808b;font-size:12px">/ Super Admin</span></h1><p id="topSubtitle">Kelola langganan usaha</p></div>
  <button class="round-btn inpos-fullscreen-btn" type="button" data-inpos-browser-fullscreen aria-label="Masuk Layar Penuh" title="Layar Penuh" aria-pressed="false"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
  <button class="round-btn" type="button" data-action="notifications" aria-label="Buka notifikasi" id="bellButton"></button>
  <button class="round-btn sa-logout" type="button" data-action="logout-ask" aria-label="Keluar Super Admin" title="Keluar" id="logoutButton"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg></button>
</header>
<main class="main" id="page" aria-live="polite"></main>
<nav class="bottom" id="bottomNav" aria-label="Navigasi utama"></nav>
</div>
<div id="sheetRoot"></div><div class="toastwrap" id="toastRoot" aria-live="polite"></div>
<script src="assets/superadmin.js?v=1470d7162a" defer></script>
<script src="assets/fullscreen.js?v=348098f317" defer></script>
</body>
</html>
