function migrateCodes(x){
 const used=new Set(),totals=new Set();let changed=false;
 for(const p of x.payments){
  const old=Number(p.uniqueCode);if(p.status!=='pending'){if(!Number.isInteger(old)||old<0||old>999){p.uniqueCode=0;changed=true}continue}
  if(Number.isInteger(old)&&old>=1&&old<=999&&!used.has(old)&&!totals.has(num(p.amount)+old)){used.add(old);totals.add(num(p.amount)+old);continue}
  let code=null;for(let i=1;i<=999;i++){if(!used.has(i)&&!totals.has(num(p.amount)+i)){code=i;break}}
  if(code==null){throw Error('Kode unik pembayaran aktif sudah penuh')}
  p.uniqueCode=code;used.add(code);totals.add(num(p.amount)+code);changed=true;
 }
 return changed;
}

function paymentMatchesPeriod(p){let d=paymentDateWIB(p);return payPeriod==='all'||(!!d&&(payPeriod==='day'?d===payPeriodDate:payPeriod==='month'?d.slice(0,7)===payPeriodMonth:d.slice(0,4)===payPeriodYear))}

function periodLabel(){if(payPeriod==='day')return 'Harian · '+date(payPeriodDate);if(payPeriod==='month')return 'Bulanan · '+new Intl.DateTimeFormat('id-ID',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(payPeriodMonth+'-01T12:00:00Z'));if(payPeriod==='year')return 'Tahunan · '+payPeriodYear;return 'Semua waktu'}
function periodInput(){if(payPeriod==='day')return `<input class="period-picker" id="paymentPeriodValue" type="date" aria-label="Tanggal transaksi" value="${esc(payPeriodDate)}">`;if(payPeriod==='month')return `<input class="period-picker" id="paymentPeriodValue" type="month" aria-label="Bulan transaksi" value="${esc(payPeriodMonth)}">`;if(payPeriod==='year'){let current=Number(wibDate().slice(0,4)),years=new Set([current,Number(payPeriodYear),...db.payments.map(p=>Number(paymentDateWIB(p).slice(0,4))).filter(y=>y>=2000&&y<=2100)]);return `<select class="period-picker" id="paymentPeriodValue" aria-label="Tahun transaksi">${[...years].sort((a,b)=>b-a).map(y=>`<option value="${y}" ${String(y)===payPeriodYear?'selected':''}>${y}</option>`).join('')}</select>`}return ''}

function discountRowMarkup(rule={}){
 const months=rule.months||3,mode=rule.mode==='fixed'?'fixed':'percent',value=rule.value??(mode==='percent'?10:5000);
 return `<div class="discount-rule" data-discount-row><div class="discount-cell"><label>Bulan</label><input aria-label="Durasi diskon (bulan)" class="discount-months" type="number" min="1" max="36" step="1" inputmode="numeric" value="${esc(months)}" required></div><div class="discount-cell"><label>Jenis</label><select aria-label="Jenis diskon" class="discount-mode"><option value="percent" ${mode==='percent'?'selected':''}>Diskon %</option><option value="fixed" ${mode==='fixed'?'selected':''}>Diskon Rp</option></select></div><div class="discount-cell"><label>Potongan</label><input aria-label="Nilai diskon" type="text" class="discount-value" inputmode="${mode==='fixed'?'numeric':'decimal'}" value="${mode==='fixed'?digits(value):esc(value)}" placeholder="0" required></div><button class="discount-remove" type="button" data-action="discount-remove" aria-label="Hapus aturan diskon" title="Hapus aturan">${I('trash',15)}</button></div>`;
}
function readDiscountDraft(){
 return [...document.querySelectorAll('[data-discount-row]')].map(row=>{
 const mode=row.querySelector('.discount-mode').value;
 return {months:Number(row.querySelector('.discount-months').value),mode,value:mode==='fixed'?parseNominal(row.querySelector('.discount-value').value):parsePercent(row.querySelector('.discount-value').value)};
 });
}
function discountModeChanged(el){const row=el.closest('[data-discount-row]'),input=row?.querySelector('.discount-value');if(!input)return;input.value=el.value==='fixed'?'5.000':'10';input.inputMode=el.value==='fixed'?'numeric':'decimal';discountPreview();}
function discountPreview(){
 const area=$('discountPreview');if(!area)return;
 const active=$('discountEnabled')?.checked===true,rules=readDiscountDraft();
 if(!rules.length){area.textContent='Belum ada aturan diskon. Harga langganan normal tetap berlaku.';return}
 const unique=new Set();let bad=false;
 const lines=rules.map(r=>{
  if(!Number.isInteger(r.months)||r.months<1||r.months>36||!Number.isFinite(r.value)||r.value<0||(r.mode==='percent'&&r.value>100)||unique.has(r.months)){bad=true;return ''}
  unique.add(r.months);
  const base=num(db.config.monthly)*r.months,cut=Math.min(base,r.mode==='percent'?Math.round(base*r.value/100):num(r.value));
  return `<span><b>${r.months} bulan:</b> ${money(base)} → <b>${money(base-cut)}</b> <small>(−${money(cut)})</small></span>`;
 }).filter(Boolean);
 area.innerHTML=`<div class="discount-preview-head">${active?'Pratinjau harga paket':'Pratinjau • diskon nonaktif'}</div>${lines.map(x=>`<div>${x}</div>`).join('')}${bad?'<div class="text-danger">Periksa durasi duplikat atau nilai tidak valid.</div>':''}`;
}
function saveDiscountSettings(){
 const enabled=$('discountEnabled')?.checked===true,rules=readDiscountDraft(),used=new Set();
 if(rules.length>20)return toast('Maksimal 20 aturan diskon.','error');
 for(const r of rules){
  const gross=num(db.config.monthly)*r.months;
  if(!Number.isInteger(r.months)||r.months<1||r.months>36||used.has(r.months)||!['percent','fixed'].includes(r.mode)||!Number.isFinite(r.value)||r.value<0|| (r.mode==='percent'&&(r.value>100||Math.abs(Math.round(r.value*100)-r.value*100)>0.00001))||(r.mode==='fixed'&&(!Number.isSafeInteger(r.value)||r.value>1000000000||r.value>gross))){
   return toast('Periksa diskon: bulan 1–36 harus unik; % maksimal 100; Rp tidak melebihi harga paket.','error');
  }
  used.add(r.months);
 }
 const before=db.config.subscriptionDiscount;
 db.config.subscriptionDiscount={enabled,rules:rules.sort((a,b)=>a.months-b.months)};
 if(save()){draw();toast('Aturan diskon langganan tersimpan. Berlaku untuk tagihan baru.')}else db.config.subscriptionDiscount=before;

/* ALUR TAGIHAN OTOMATIS (DEMO):
 Mitra menulis array permintaan ke localStorage[TENANT_REQUESTS_KEY], contoh:
 [{"requestId":"REQ-unik-123", "tenantId":"T001", "type":"sub", "months":3, "method":"QRIS"}]
 Ketika panel Super Admin dibuka / tab fokus / storage berubah, permintaan diproses.
 Balasan: localStorage[TENANT_RESPONSES_KEY] = {"REQ-unik-123":{status:"created",paymentId:"P005",total:...,uniqueCode:...}}.
 Produksi WAJIB menggunakan server autentikasi, penentuan tenant dari sesi, transaksi atomik,
 pembatasan request dan webhook/gateway terverifikasi, bukan localStorage atau perhitungan klien.
*/
function processTenantRequests(){
 let requests,results;
 try{
  const raw=JSON.parse(localStorage.getItem(TENANT_REQUESTS_KEY)||'[]');
  requests=Array.isArray(raw)?raw:(Array.isArray(raw?.requests)?raw.requests:[]);
  if(!requests.length)return;
  const prev=JSON.parse(localStorage.getItem(TENANT_RESPONSES_KEY)||'{}');
  results=prev&&typeof prev==='object'&&!Array.isArray(prev)?prev:{};
 }catch(e){console.warn('Permintaan mitra demo tidak valid',e);return}
 // Pulihkan hasil jika data tagihan tersimpan tetapi balasan belum ditulis (mis. browser ditutup).
 const snapshot=JSON.stringify(db);let created=0,changed=false;
 const addResponse=(requestId,p,status)=>{results[requestId]={status,paymentId:p.id,amount:num(p.amount),uniqueCode:num(p.uniqueCode),total:paymentTotal(p),type:p.type,months:p.months,updatedAt:nowISO()};changed=true};
 for(const req of requests.slice(-500)){
  if(!req||typeof req!=='object')continue;
  const rid=String(req.requestId||'').trim();
  if(!/^[a-zA-Z0-9_-]{8,90}$/.test(rid)||Object.hasOwn(results,rid))continue;
  const former=db.payments.find(p=>p.requestId===rid);
  if(former){addResponse(rid,former,'existing');continue}
  const tenantId=String(req.tenantId||'').trim();
  const tenant=db.tenants.find(t=>t.id===tenantId);
  const type=String(req.type||''),months=Number(req.months);
  let reason='';
  if(!tenant)reason='Mitra tidak ditemukan';
  else if(tenant.suspended)reason='Usaha ditangguhkan';
  else if(!['sub','tax'].includes(type))reason='Jenis tagihan tidak valid';
  else if(!Number.isInteger(months)||months<1||months>36)reason='Durasi harus 1–36 bulan';
  else if(!Number.isSafeInteger(num(type==='tax'?db.config.tax:db.config.monthly))||num(type==='tax'?db.config.tax:db.config.monthly)<=0)reason='Tarif belum tersedia';
  if(reason){results[rid]={status:'error',message:reason,updatedAt:nowISO()};changed=true;continue}
  // Satu tagihan tertunda per tenant + fitur. Pengajuan ulang mengembalikan tagihan yang sama.
  const pendingInvoice=db.payments.find(p=>p.tenantId===tenant.id&&p.type===type&&p.status==='pending');
  if(pendingInvoice){addResponse(rid,pendingInvoice,'existing');continue}
  const quote=quoteSubscription(type,months),uniqueCode=nextUniqueCode(quote.amount);
  if(uniqueCode==null){results[rid]={status:'error',message:'Kode unik sedang penuh',updatedAt:nowISO()};changed=true;continue}
  const method=['QRIS','Transfer'].includes(req.method)?req.method:'QRIS';
  db.nextPayment=num(db.nextPayment)+1;
  const id='P'+String(db.nextPayment).padStart(3,'0');
  const p={id,requestId:rid,source:'tenant-request-demo',tenantId:tenant.id,type,months,amount:quote.amount,gross:quote.gross,discount:quote.discount,uniqueCode,method,status:'pending',created:nowISO(),handledAt:'',note:'Permintaan otomatis dari mitra (demo)'};
  db.payments.unshift(p);
  addNote('Permintaan pembayaran otomatis',tenant.name+' • '+labelType(type)+' '+months+' bulan • '+money(paymentTotal(p)),id);
  addResponse(rid,p,'created');created++;
 }
 if(!changed)return;
 // Persist the invoice before returning a response to the tenant.
 if(created&&!save()){db=JSON.parse(snapshot);return}
 try{localStorage.setItem(TENANT_RESPONSES_KEY,JSON.stringify(results))}
 catch(e){console.warn('Balasan permintaan mitra tidak dapat disimpan',e)}
 if(created){draw();toast(created+' tagihan otomatis diterima dari mitra.')} 
}

function handleBroadcastImage(file){
 if(!file)return;
 captureBroadcastDraft();
 if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>3*1024*1024){toast('Gambar harus JPG, PNG atau WebP, maksimal 3 MB.','error');return}
 const fr=new FileReader();
 fr.onerror=()=>toast('Gagal membaca gambar.','error');
 fr.onload=()=>{
  const img=new Image();img.onerror=()=>toast('File gambar tidak dapat dibuka.','error');
  img.onload=()=>{
   try{
    const scale=Math.min(1,960/img.naturalWidth,540/img.naturalHeight);
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    const ctx=canvas.getContext('2d');if(!ctx)throw Error('canvas');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
    let out='';for(const q of [.76,.61,.46,.33]){out=canvas.toDataURL('image/jpeg',q);if(out.length<240000)break}
    if(!safeBroadcastImage(out))throw Error('too large');broadcastDraft.image=out;broadcastOpen();toast('Gambar broadcast ditambahkan.');
   }catch(err){toast('Gambar terlalu besar untuk disimpan dalam demo.','error')}

 };

// Integrasi Laravel diperlukan. Endpoint HARUS dilindungi auth Super Admin, CSRF, rate limiting,
// mengirim token sekali pakai ke email owner terverifikasi, dan tidak pernah mengembalikan token.
// POST /api/super-admin/tenants/{tenantId}/password-reset, response JSON: {"sent":true}.
// Server WAJIB menentukan penerima dari tenantId di database, bukan dari email dari browser.
const PASSWORD_RESET_API='/api/super-admin/tenants';
function passwordResetAsk(id){
 const t=getTenant(id);if(!t)return toast('Usaha tidak ditemukan','error');
 if(!t.email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t.email)){

 }
 showSheet('Reset Password',`Usaha #${t.code}`,`<div class="detail-banner"><h3>${esc(t.name)}</h3><p>${esc(t.owner)} · Pemilik usaha</p></div><p class="setting-help">Kirim tautan reset password ke email pemilik yang terdaftar:</p><div class="reset-confirm-email">${I('mail',19)}<b>${esc(t.email)}</b></div><div class="info-line">Password/PIN tidak ditampilkan dan tidak diubah melalui Super Admin. Tautan reset dibuat oleh server, bersifat sekali pakai, dan memiliki batas waktu berlaku.</div><p class="subtle">Pengiriman email memerlukan backend Laravel INPOS yang aktif; mode HTML lokal tidak dapat mengirim email otomatis.</p>`,`<button class="btn" data-action="tenant-detail" data-id="${esc(id)}">Batal</button><button class="btn primary" data-action="password-reset-send" data-id="${esc(id)}" id="passwordResetSend">${I('mail',16)} Kirim Email Reset</button>`);
}
async function sendPasswordReset(id){
 const t=getTenant(id);if(!t)return toast('Usaha tidak ditemukan','error');
 if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){
  toast('Email otomatis belum tersedia. Jalankan INPOS pada server Laravel dengan HTTPS.','error');return;
 }
 const btn=$('passwordResetSend');if(!btn||btn.disabled)return;
 btn.disabled=true;btn.innerHTML=`${I('clock',16)} Mengirim…`;
 const csrf=document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
 const headers={'Accept':'application/json','Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'};
 if(csrf)headers['X-CSRF-TOKEN']=csrf;
 try{
  const res=await fetch(`${PASSWORD_RESET_API}/${encodeURIComponent(id)}/password-reset`,{
   method:'POST',headers,credentials:'same-origin',redirect:'error',body:'{}'
  });
  if(!res.ok){
   const message=res.status===401||res.status===403?'Hanya Super Admin yang sudah login dapat mengirim reset password.':res.status===404||res.status===405||res.status===501?'Layanan reset password belum terpasang pada server INPOS.':res.status===419?'Sesi keamanan kedaluwarsa. Silakan login kembali.':res.status===429?'Batas pengiriman email tercapai. Coba kembali nanti.':'Email gagal dikirim. Periksa backend dan pengaturan email.';
   throw new Error(message);
  }
  if(!(res.headers.get('content-type')||'').includes('application/json'))throw new Error('Server tidak memberikan konfirmasi JSON. Periksa integrasi API.');
  const result=await res.json();
  if(result?.sent!==true)throw new Error('Server belum mengonfirmasi email terkirim. Periksa layanan email.');
  addNote('Email reset password diminta',`${t.name} • ${t.email}`);
  save();closeSheet();draw();toast('Permintaan reset password berhasil diproses dan email dikonfirmasi server.');
 }catch(err){
  let message=String(err?.message||'Gagal menghubungi server.');
  if(err instanceof TypeError||/Failed to fetch|NetworkError/i.test(message))message='Tidak dapat menghubungi API INPOS. Pastikan server Laravel aktif.';
  toast(message,'error');
 }finally{const current=$('passwordResetSend');if(current){current.disabled=false;current.innerHTML=`${I('mail',16)} Kirim Email Reset`;}}
}

function normalizeConfirmWhatsapp(raw){
 const clean=String(raw||'').trim().replace(/[\s.()-]/g,'');

 if(digits.startsWith('0'))digits='62'+digits.slice(1);
 else if(digits.startsWith('8'))digits='62'+digits;
 return /^628[1-9]\d{6,11}$/.test(digits)?digits:null;

document.addEventListener('click',e=>{if(e.target.id==='sheetBackdrop')closeSheet();let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;switch(a){case'goto':goto(id);break;case'close':closeSheet();break;case'notifications':notifications();break;case'logout-ask':showSheet('Keluar Super Admin','Akhiri sesi demo',`<div class="info-line">Keluar dari panel? Data mitra dan transaksi demo tetap tersimpan di browser ini.</div>`,`<button class="btn" data-action="close">Batal</button><button class="btn primary" data-action="logout-confirm">Keluar</button>`);break;case'logout-confirm':sessionStorage.removeItem('inpos_superadmin_demo_auth_v20');location.reload();break;case'broadcast-open':broadcastOpen();break;case'broadcast-preview':broadcastPreview();break;case'broadcast-ask':broadcastAsk();break;case'broadcast-confirm':broadcastConfirm();break;case'broadcast-history':broadcastDetail(id);break;case'broadcast-remove-image':captureBroadcastDraft();broadcastDraft.image='';broadcastOpen();break;case'pending':payTab='pending';goto('payments');break;case'pay-history':payTab='history';goto('payments');break;case'filter-tenant':tenantFilter=b.dataset.filter;goto('tenants');break;case'paytab':payTab=id;draw();break;case'pay-period':if(['all','day','month','year'].includes(id)){payPeriod=id;draw()}break;case'discount-add':{const rows=$('discountRules');if(rows){if(rows.children.length>=20)return toast('Maksimal 20 aturan diskon.','error');const used=new Set(readDiscountDraft().map(r=>r.months));let m=[3,6,12,1,2,4,5,9].find(n=>!used.has(n))||Array.from({length:36},(_,i)=>i+1).find(n=>!used.has(n));rows.insertAdjacentHTML('beforeend',discountRowMarkup({months:m||1,mode:'percent',value:10}));discountPreview()}break}case'discount-remove':b.closest('[data-discount-row]')?.remove();discountPreview();break;case'add-tenant':tenantForm();break;case'export-tenants':exportTenants();break;case'export-payments':exportPayments();break;case'sync-demo-now':sync eCorrupt;db=formState.import;storageCorrupt=false;if(!save()){db=before;storageCorrupt=blocked;break}delete formState.import;syncBroadcastFeed();closeSheet();goto('home');toast('Data cadangan berhasil diimpor.');break}case'save-merchant':saveMerchant();break;case'remove-qris':{const before=db.config.qris;db.config.qris='';if(!save()){db.config.qris=before;break}draw();toast('Gambar QRIS dihapus.');break;}}});
document.addEventListener('input',e=>{if(e.target.id==='broadcastTitle'||e.target.id==='broadcastBody'){captureBroadcastDraft();const count=$(e.target.id+'Count');if(count)count.textContent=e.target.value.length+'/'+(e.target.id==='broadcastTitle'?80:600)}else if(e.target.id==='tenantSearch'){tenantSearch=e.target.value;updateTenantResults()}else if(e.target.id==='paymentSearch'){paySearch=e.target.value;updatePaymentResults()}else if(e.target.matches('.discount-value')){const mode=e.target.closest('[data-discount-row]')?.querySelector('.discount-mode')?.value;if(mode==='fixed')formatNominalField(e.target);discountPreview()}else if(e.target.matches('.discount-months'))discountPreview();else if(e.target.matches('[data-rupiah]')){formatNominalField(e.target);if(e.target.id==='referralFixed')referralPreview()}else if(['referralPercent'].includes(e.target.id))referralPreview()});

})();

<script id="inposBrowserFullscreenV1">
(function(){'use strict';
 const controls=Array.from(document.querySelectorAll('[data-inpos-browser-fullscreen]'));
 if(!controls.length)return;
 const expand="<svg viewBox=\"0 0 24 24\" width=\"19\" height=\"19\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5\"/></svg>",collapse="<svg viewBox=\"0 0 24 24\" width=\"19\" height=\"19\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 9h6V3M21 9h-6V3M3 15h6v6M21 15h-6v6\"/></svg>";
 const isFull=()=>Boolean(document.fullscreenElement||document.webkitFullscreenElement);
 let noteTimer=0;
 function feedback(message){
  let box=document.getElementById('inposFullscreenFeedback');
  if(!box){box=document.createElement('div');box.id='inposFullscreenFeedback';box.setAttribute('role','status');box.setAttribute('aria-live','polite');document.body.appendChild(box)}
  box.textContent=message;box.hidden=false;
  clearTimeout(noteTimer);noteTimer=setTimeout(()=>{box.hidden=true},4000);
 }
 function render(){
  const on=isFull();document.documentElement.classList.toggle('inpos-browser-fullscreen-on',on);
  controls.forEach(button=>{
   button.innerHTML=on?collapse:expand;
   button.setAttribute('aria-label',on?'Keluar Layar Penuh':'Masuk Layar Penuh');
   button.setAttribute('title',on?'Keluar Layar Penuh':'Layar Penuh');
   button.setAttribute('aria-pressed',String(on));
  });
 }
 async function toggle(){
  try{
   if(isFull()){
    if(document.exitFullscreen)await document.exitFullscreen();
    else if(document.webkitExitFullscreen)await document.webkitExitFullscreen();
    else feedback('Keluar dari layar penuh lewat kontrol browser.');
   }else{
    const element=document.documentElement;
    if(element.requestFullscreen)await element.requestFullscreen({navigationUI:'hide'});
    else if(element.webkitRequestFullscreen)await element.webkitRequestFullscreen();
    else {feedback('Browser ini belum mendukung Layar Penuh. Gunakan mode aplikasi/PWA dari menu browser.');return}
   }
  }catch(err){feedback('Layar Penuh tidak diizinkan oleh browser atau halaman sematan.');}
  render();
 }
 controls.forEach(button=>button.addEventListener('click',toggle));
 document.addEventListener('fullscreenchange',render);
 document.addEventListener('webkitfullscreenchange',render);
 render();
})();
</script>
